try {

  r.className = t === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : (t || 'sepia');

  if (s.ui && s.ui.side === 'mini') r.classList.add('side-mini');
  if (s.ui && s.ui.size) r.style.fontSize = s.ui.size + '%';
} catch (e) {}
</script>
<style>
/* üç dil rengi sitenin her yerinde aynı şeyi gösteriyor. --k bağlaç (pas kırmızısı), --v yan cümle fiili (yeşil), --h ana cümle fiili (lacivert) */
:root {
  --bg: #F2E8D5; --bg-2: #EADDC4; --paper: #FBF5E9; --paper-2: #F6EEDD; --sunk: #EDE2CC;
  --ink: #2A2016; --ink-2: #5B4B39; --ink-3: #8A775F; --line: rgba(74, 52, 28, .14); --line-2: rgba(74, 52, 28, .24);
  --accent: #B04A23; --accent-2: #8F3A19; --accent-soft: #F1D9C6; --on-accent: #FFF8EF;
  --k: #B04A23; --k-bg: #F4DCCB;
  --v: #2D6A55; --v-bg: #D3E6D9;
  --h: #2F4E86; --h-bg: #D9E2F1;
  --ok: #2D6A45; --ok-bg: #DCEBD9; --no: #A63A2E; --no-bg: #F5D9D2; --gold: #C08A2E; --gold-bg: #F4E3BE;
  --glow-1: rgba(214, 150, 84, .28); --glow-2: rgba(188, 96, 70, .14); --glow-3: rgba(120, 140, 100, .12);
  --grain: .55; --grain-blend: multiply;
  --shadow-1: 0 1px 0 rgba(255, 255, 255, .5) inset, 0 1px 2px rgba(60, 40, 15, .06), 0 6px 18px -6px rgba(60, 40, 15, .12);
  --shadow-2: 0 1px 0 rgba(255, 255, 255, .55) inset, 0 2px 4px rgba(60, 40, 15, .06), 0 18px 40px -14px rgba(60, 40, 15, .28);
  --glass: rgba(251, 245, 233, .78);
  --fur: #8C5A36; --fur-2: #6E4426; --cream: #F6E6CC; --nose: #3A2416; --scarf: #B04A23; --scarf-2: #8F3A19; --cheek: #E9A587;
  --serif: "Fraunces", "Iowan Old Style", Georgia, serif;
  --sans: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 18px; --r-lg: 26px; --r-sm: 12px;
  --ease: cubic-bezier(.16, 1, .3, 1); --ease-io: cubic-bezier(.65, 0, .35, 1); --spring: cubic-bezier(.34, 1.4, .64, 1);
  --read: 720px; --wide: 1040px;
  color-scheme: light;
}
:root.light {
  --bg: #F7F4EE; --bg-2: #EFEAE1; --paper: #FFFFFF; --paper-2: #FAF8F4; --sunk: #F1EDE6;
  --ink: #1D1915; --ink-2: #554B40; --ink-3: #877C70; --line: rgba(40, 30, 20, .11); --line-2: rgba(40, 30, 20, .2);
  --accent-soft: #F6E0D3; --glass: rgba(255, 255, 255, .8);
  --glow-1: rgba(230, 170, 110, .2); --glow-2: rgba(200, 110, 90, .09); --glow-3: rgba(110, 150, 130, .1); --grain: .3;
}
:root.dark {
  --bg: #17130F; --bg-2: #1F1A15; --paper: #231D17; --paper-2: #2A231C; --sunk: #2E271F;
  --ink: #F1E7D6; --ink-2: #C3B49C; --ink-3: #8F826E; --line: rgba(241, 225, 200, .1); --line-2: rgba(241, 225, 200, .2);
  --accent: #E4825A; --accent-2: #F0A07E; --accent-soft: #46291C; --on-accent: #1A120C;
  --k: #EE8E66; --k-bg: #47291D;
  --v: #79C9AA; --v-bg: #1E3A30;
  --h: #9DB8F0; --h-bg: #232F48;
  --ok: #8BD3A0; --ok-bg: #1E3626; --no: #F19A8C; --no-bg: #48241F; --gold: #E5B562; --gold-bg: #3E3020;
  --glow-1: rgba(214, 130, 70, .14); --glow-2: rgba(170, 80, 60, .1); --glow-3: rgba(90, 130, 110, .08);
  --grain: .5; --grain-blend: soft-light;
  --shadow-1: 0 1px 0 rgba(255, 240, 220, .04) inset, 0 1px 2px rgba(0, 0, 0, .3), 0 8px 22px -8px rgba(0, 0, 0, .5);
  --shadow-2: 0 1px 0 rgba(255, 240, 220, .05) inset, 0 2px 6px rgba(0, 0, 0, .35), 0 22px 48px -16px rgba(0, 0, 0, .7);
  --glass: rgba(35, 29, 23, .78);
  --fur: #A06B44; --fur-2: #7B4E2E; --cream: #F0DDBF; --scarf: #E4825A; --scarf-2: #B95F3B; --cheek: #D98C6E;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 96px; }
body {
  margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
  font: 400 1.0625rem/1.62 var(--sans); letter-spacing: -.003em;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; font-kerning: normal;
  font-feature-settings: "kern", "liga", "calt";
  overflow-x: hidden;
}
/* arkada sıcak ışık lekeleri, kâğıt dokusu, en üstte de silik çizgiler */
body::before {
  content: ""; position: fixed; inset: 0; z-index: -2; pointer-events: none;
  background:
    radial-gradient(60vmax 42vmax at 8% -6%, var(--glow-1), transparent 62%),
    radial-gradient(48vmax 40vmax at 104% 8%, var(--glow-2), transparent 60%),
    radial-gradient(56vmax 46vmax at 70% 110%, var(--glow-3), transparent 62%),
    var(--bg);
}
body::after {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: var(--grain); mix-blend-mode: var(--grain-blend);
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .32  0 0 0 0 .24  0 0 0 0 .15  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
.ruled { position: absolute; inset: 0 0 auto; height: 520px; z-index: -1; pointer-events: none;
  background-image: linear-gradient(to bottom, var(--line) 1px, transparent 1px); background-size: 100% 34px;
  -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,.55), transparent 85%); mask-image: linear-gradient(to bottom, rgba(0,0,0,.55), transparent 85%); }
::selection { background: var(--accent-soft); color: var(--ink); }
a { color: var(--accent); text-underline-offset: .18em; }
svg.i { width: 1.15em; height: 1.15em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.2em; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 3px; border-radius: 10px; }
[lang="de"] { font-feature-settings: "kern", "liga", "calt", "onum" 0; }

.top { position: sticky; top: 0; z-index: 30; padding: max(12px, env(safe-area-inset-top)) 16px 0; pointer-events: none; }
.bar {
  pointer-events: auto; max-width: var(--wide); margin: 0 auto; height: 60px; display: flex; align-items: center; gap: 12px;
  padding: 0 8px 0 14px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line);
  -webkit-backdrop-filter: saturate(160%) blur(18px); backdrop-filter: saturate(160%) blur(18px); box-shadow: var(--shadow-1);
  transition: box-shadow .4s var(--ease), background-color .4s;
}
.top.scrolled .bar { box-shadow: var(--shadow-2); }
.brand { display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 4px 6px; cursor: pointer; border-radius: 999px; flex: none; }
.brand .mk { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--bg); font: 600 1.05rem/1 var(--serif); font-style: italic; letter-spacing: -.04em; font-variation-settings: "SOFT" 100, "opsz" 30; }
.brand .wm { font: 500 1.18rem/1 var(--serif); letter-spacing: -.02em; font-variation-settings: "SOFT" 60, "opsz" 36; }
.brand .wm i { color: var(--accent); }
.tabs { position: relative; display: flex; gap: 2px; margin: 0 auto; padding: 4px; border-radius: 999px; background: color-mix(in srgb, var(--sunk) 70%, transparent); }
.tabs button { position: relative; z-index: 1; border: 0; background: none; cursor: pointer; padding: 8px 16px; border-radius: 999px; font-weight: 550; font-size: .95rem; color: var(--ink-2); display: flex; align-items: center; gap: 7px; transition: color .25s; white-space: nowrap; }
.tabs button:hover { color: var(--ink); }
.tabs button.on { color: var(--ink); }
.tabs .pill { position: absolute; z-index: 0; top: 4px; left: 0; height: calc(100% - 8px); border-radius: 999px; background: var(--paper); box-shadow: 0 1px 2px rgba(40, 25, 10, .1), 0 4px 10px -4px rgba(40, 25, 10, .18); transition: transform .5s var(--spring), width .5s var(--spring); }
.icon-btn { width: 44px; height: 44px; flex: none; border-radius: 50%; border: 0; background: none; cursor: pointer; display: grid; place-items: center; color: var(--ink-2); transition: background-color .2s, color .2s, transform .2s var(--spring); }
.icon-btn:hover { background: var(--sunk); color: var(--ink); }
.icon-btn:active { transform: scale(.92); }
.icon-btn svg.i { width: 21px; height: 21px; }
.progress { position: fixed; z-index: 31; left: 0; top: 0; height: 3px; width: 100%; transform-origin: 0 50%; transform: scaleX(0); background: linear-gradient(90deg, var(--accent), var(--gold)); pointer-events: none; }

.dock { display: none; }
@media (max-width: 760px) {
  .top { padding: max(8px, env(safe-area-inset-top)) 10px 0; }
  .bar { height: 54px; padding: 0 4px 0 8px; }
  .bar .tabs { display: none; }
  .brand { margin-right: auto; }
  .dock {
    display: flex; position: fixed; z-index: 30; left: 10px; right: 10px; bottom: max(10px, env(safe-area-inset-bottom)); height: 64px; padding: 6px;
    border-radius: 24px; background: var(--glass); border: 1px solid var(--line); box-shadow: var(--shadow-2);
    -webkit-backdrop-filter: saturate(160%) blur(18px); backdrop-filter: saturate(160%) blur(18px);
  }
  .dock button { position: relative; z-index: 1; flex: 1; border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: .7rem; font-weight: 600; color: var(--ink-3); border-radius: 18px; cursor: pointer; transition: color .25s; -webkit-tap-highlight-color: transparent; }
  .dock button svg.i { width: 22px; height: 22px; transition: transform .45s var(--spring); }
  .dock button.on { color: var(--ink); }
  .dock button.on svg.i { transform: translateY(-1px) scale(1.06); }
  .dock .pill { position: absolute; z-index: 0; top: 0; left: 0; height: calc(100% - 12px); border-radius: 18px; background: var(--paper); box-shadow: 0 1px 2px rgba(40, 25, 10, .1); transition: transform .5s var(--spring), width .5s var(--spring); }
}

/* masaüstünde kenar çubuğu solda, daraltılabiliyor */
.side-foot { display: contents; }
.side-foot .icon-btn span { display: none; }
#col-btn { display: none; }
@media (min-width: 761px) {
  :root { --side: 236px; }
  html.side-mini { --side: 84px; }
  body { padding-left: var(--side); transition: padding-left .45s var(--ease); }
  .top { position: fixed; left: 0; top: 0; bottom: 0; width: var(--side); padding: 0; transition: width .45s var(--ease); }
  .bar { height: 100%; max-width: none; flex-direction: column; align-items: stretch; gap: 8px; padding: max(16px, env(safe-area-inset-top)) 12px 16px max(12px, env(safe-area-inset-left)); border-radius: 0; border-width: 0 1px 0 0; box-shadow: none; overflow: hidden auto; }
  .top.scrolled .bar { box-shadow: none; }
  .brand { padding: 4px; }
  .brand .wm, .tabs span, .side-foot span { white-space: nowrap; transition: opacity .3s var(--ease); }
  .tabs { flex-direction: column; margin: 14px 0 auto; padding: 0; gap: 4px; background: none; }
  .tabs button { padding: 12px 14px; border-radius: 14px; gap: 12px; overflow: hidden; }
  .tabs button svg.i { width: 20px; height: 20px; }
  .tabs .pill { top: 0; border-radius: 14px; transition: transform .5s var(--spring), height .5s var(--spring), width .5s var(--spring); }
  .side-foot .icon-btn span { display: block; }
  .side-foot { display: flex; flex-direction: column; gap: 4px; border-top: 1px solid var(--line); padding-top: 8px; }
  .side-foot .icon-btn, #col-btn { display: flex; width: auto; height: 44px; border-radius: 14px; justify-content: flex-start; align-items: center; gap: 12px; padding: 0 14px; font-weight: 550; font-size: .95rem; overflow: hidden; }
  #col-btn svg.i { transition: transform .45s var(--ease); }
  html.side-mini #col-btn svg.i { transform: scaleX(-1); }
  html.side-mini .brand .wm, html.side-mini .tabs span, html.side-mini .side-foot span { opacity: 0; width: 0; overflow: hidden; }
  html.side-mini .tabs button, html.side-mini .side-foot .icon-btn, html.side-mini #col-btn { justify-content: center; padding: 0; gap: 0; }
  html.side-mini .tabs button { height: 46px; }
  html.side-mini .brand { justify-content: center; gap: 0; }
  .timer { top: 16px; }
}

main { position: relative; padding: 40px 22px 120px; }
#view { margin: 0 auto; max-width: var(--read); display: flex; flex-direction: column; gap: 22px; }
#view.wide { max-width: var(--wide); }
@media (max-width: 760px) { main { padding: 26px 16px calc(110px + env(safe-area-inset-bottom)); } #view { gap: 18px; } }

.eyebrow { display: flex; align-items: center; gap: 8px; font: 650 .74rem/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.eyebrow .num { font-variant-numeric: tabular-nums; color: var(--ink-3); }
.eyebrow .dot { width: 4px; height: 4px; border-radius: 50%; background: currentColor; opacity: .5; }
h1, h2, h3 { margin: 0; font-family: var(--serif); color: var(--ink); text-wrap: balance; }
h1 { font-size: clamp(2.5rem, 7vw, 4.4rem); line-height: .98; font-weight: 450; letter-spacing: -.035em; font-variation-settings: "opsz" 144, "SOFT" 40; }
h1 em { font-style: italic; color: var(--accent); font-variation-settings: "opsz" 144, "SOFT" 100; }
h1.md { font-size: clamp(2.2rem, 5.6vw, 3.4rem); }
h2 { font-size: clamp(1.55rem, 3.4vw, 2rem); line-height: 1.12; font-weight: 500; letter-spacing: -.02em; font-variation-settings: "opsz" 72, "SOFT" 50; margin-top: 18px; display: flex; align-items: baseline; gap: 12px; }
h2 .hn { font: 600 .78rem/1 var(--sans); letter-spacing: .08em; color: var(--ink-3); font-variant-numeric: tabular-nums; transform: translateY(-.35em); }
h3 { font-size: 1.22rem; font-weight: 560; letter-spacing: -.01em; font-variation-settings: "opsz" 30; }
p { margin: 0; text-wrap: pretty; }
.lede { font-size: clamp(1.1rem, 2.2vw, 1.28rem); line-height: 1.55; color: var(--ink-2); max-width: 36em; }
#view > p, .card p { hyphens: auto; }
b, strong { font-weight: 650; }
.muted { color: var(--ink-3); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.spacer { height: 6px; }

.k { color: var(--k); font-weight: 650; background: var(--k-bg); border-radius: 6px; padding: 0 .28em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.v { color: var(--v); font-weight: 650; background: linear-gradient(transparent 58%, var(--v-bg) 58%); padding: 0 .06em; }
.h { color: var(--h); font-weight: 650; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: .2em; text-decoration-color: color-mix(in srgb, var(--h) 45%, transparent); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: .88rem; color: var(--ink-2); }
.legend > span { display: inline-flex; align-items: center; gap: 8px; }

.btn {
  --b: var(--ink); --f: var(--bg);
  display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 46px; padding: 0 20px; border-radius: 999px;
  border: 1px solid transparent; background: var(--b); color: var(--f); font-weight: 600; font-size: .98rem; cursor: pointer; text-decoration: none;
  box-shadow: 0 1px 2px rgba(30, 20, 10, .12), 0 6px 16px -8px rgba(30, 20, 10, .4);
  transition: transform .35s var(--spring), box-shadow .35s var(--ease), background-color .2s, opacity .2s; -webkit-tap-highlight-color: transparent;
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 2px 4px rgba(30, 20, 10, .12), 0 12px 24px -10px rgba(30, 20, 10, .45); }
.btn:active { transform: scale(.97); transition-duration: .12s; }
.btn:disabled { opacity: .5; cursor: default; transform: none; }
.btn.accent { --b: var(--accent); --f: var(--on-accent); }
.btn.ghost { --b: transparent; --f: var(--ink); border-color: var(--line-2); box-shadow: none; }
.btn.ghost:hover { background: var(--paper); box-shadow: var(--shadow-1); }
.btn.lg { min-height: 54px; padding: 0 26px; font-size: 1.04rem; }
.btn.sm { min-height: 38px; padding: 0 14px; font-size: .9rem; }
.btn .arr { transition: transform .35s var(--spring); }
.btn:hover .arr { transform: translateX(3px); }

.card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 24px; box-shadow: var(--shadow-1); }
.card h3 { margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.card.flat { box-shadow: none; background: var(--paper-2); }
@media (max-width: 760px) { .card { padding: 18px; border-radius: 22px; } }

.hero { display: flex; flex-direction: column; gap: 18px; padding-top: 6px; }
.hero h1 { max-width: 12ch; }
.hero .cta { margin-top: 6px; }
.next {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 18px; width: 100%; text-align: left; cursor: pointer;
  padding: 18px 20px; border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--paper); box-shadow: var(--shadow-1);
  transition: transform .4s var(--spring), box-shadow .4s var(--ease);
}
.next:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); }
.next:active { transform: scale(.99); }
.next .nb { width: 52px; height: 52px; border-radius: 16px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font: 500 1.4rem/1 var(--serif); font-variant-numeric: tabular-nums; }
.next small { display: block; font-size: .78rem; font-weight: 650; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.next b { display: block; font: 500 1.35rem/1.2 var(--serif); letter-spacing: -.015em; margin: 3px 0 2px; }
.next span.d { color: var(--ink-2); font-size: .95rem; }
.next .go { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--sunk); transition: transform .4s var(--spring), background-color .2s; }
.next:hover .go { transform: translateX(3px); background: var(--accent-soft); color: var(--accent); }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.stat { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 16px 14px; box-shadow: var(--shadow-1); display: flex; flex-direction: column; gap: 4px; }
.stat .n { font: 450 2.2rem/1 var(--serif); letter-spacing: -.03em; font-variant-numeric: tabular-nums lining-nums; font-variation-settings: "opsz" 96; }
.stat .n small { font-size: .5em; color: var(--ink-3); margin-left: 2px; }
.stat .l { font-size: .84rem; color: var(--ink-2); font-weight: 550; }
.meter { height: 6px; border-radius: 6px; background: var(--sunk); overflow: hidden; margin-top: 8px; }
.meter i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--c, var(--accent)); transition: width 1.2s var(--ease) .2s; }
@media (max-width: 760px) { .stats { grid-template-columns: repeat(2, 1fr); } .stat .n { font-size: 1.9rem; } }

.path { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.path li { position: relative; display: grid; grid-template-columns: 40px 1fr; gap: 14px; padding-bottom: 6px; }
.path li::before { content: ""; position: absolute; left: 19px; top: 40px; bottom: -2px; width: 2px; background: var(--line-2); border-radius: 2px; }
.path li:last-child::before { display: none; }
.path li.done::before { background: var(--ok); opacity: .5; }
.path .dot { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--paper); border: 1.5px solid var(--line-2); color: var(--ink-3); font: 600 .9rem/1 var(--sans); font-variant-numeric: tabular-nums; z-index: 1; }

.path .pb:hover { background: color-mix(in srgb, var(--paper) 70%, transparent); }
.path .pb b { display: block; font: 500 1.12rem/1.3 var(--serif); letter-spacing: -.01em; }
.path .pb small { color: var(--ink-2); font-size: .92rem; }
.path li.now .pb b::after { content: "Sıradaki"; margin-left: 10px; font: 650 .66rem/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); padding: 4px 8px; border-radius: 999px; vertical-align: 3px; }

.two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 760px) { .two { grid-template-columns: 1fr; } }

.why { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.why > div { padding: 16px; border-radius: var(--r); background: var(--paper-2); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }

.why span { font-size: .92rem; color: var(--ink-2); }
.why cite { font-size: .76rem; color: var(--ink-3); font-style: normal; letter-spacing: .02em; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.tile {
  position: relative; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start; gap: 6px; text-align: left; cursor: pointer; min-height: 150px;
  padding: 18px; border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--paper); box-shadow: var(--shadow-1); overflow: hidden;
  transition: transform .45s var(--spring), box-shadow .45s var(--ease);
}

.tile:active { transform: scale(.985); }
.tile .ti { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; background: var(--tc, var(--accent-soft)); color: var(--tf, var(--accent)); margin-bottom: 10px; }

.tile .badge { position: absolute; right: 14px; top: 14px; min-width: 26px; height: 26px; padding: 0 8px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-size: .8rem; font-weight: 700; display: grid; place-items: center; }

.toc { display: flex; flex-direction: column; gap: 28px; }

.toc-i {
  width: 100%; display: grid; grid-template-columns: 54px 1fr auto; align-items: center; gap: 14px; text-align: left; cursor: pointer;
  padding: 18px 6px; border: 0; border-bottom: 1px solid var(--line); background: none; transition: background-color .25s, padding .35s var(--ease);
}
.toc-i:hover { background: color-mix(in srgb, var(--paper) 65%, transparent); padding-left: 14px; }
.toc-i .no { font: 400 1.9rem/1 var(--serif); letter-spacing: -.03em; color: var(--ink-3); font-variant-numeric: tabular-nums lining-nums; font-variation-settings: "opsz" 96; }
.toc-i b { display: block; font: 500 1.3rem/1.2 var(--serif); letter-spacing: -.015em; }
.toc-i small { display: block; color: var(--ink-2); font-size: .93rem; margin-top: 3px; }
.toc-i .pc { font-size: .82rem; font-weight: 650; color: var(--ink-3); font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 8px; }
.ring { width: 28px; height: 28px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 3.2; }
.ring .bg { stroke: var(--sunk); }
.ring .fg { stroke: var(--ok); stroke-linecap: round; transition: stroke-dashoffset 1s var(--ease); }
@media (max-width: 760px) { .toc-i { grid-template-columns: 40px 1fr auto; gap: 10px; } .toc-i .no { font-size: 1.5rem; } .toc-i b { font-size: 1.15rem; } }

.strip { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -22px; padding: 2px 22px 4px; -webkit-mask-image: linear-gradient(90deg, transparent, #000 22px, #000 calc(100% - 22px), transparent); mask-image: linear-gradient(90deg, transparent, #000 22px, #000 calc(100% - 22px), transparent); }
.strip::-webkit-scrollbar { display: none; }
.strip button { flex: none; border: 1px solid var(--line); background: var(--paper-2); border-radius: 999px; padding: 7px 13px; font-size: .86rem; font-weight: 600; color: var(--ink-2); cursor: pointer; display: flex; align-items: center; gap: 7px; transition: background-color .2s, color .2s, border-color .2s; white-space: nowrap; }
.strip button:hover { color: var(--ink); border-color: var(--line-2); }
.strip button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.strip button .ck { width: 15px; height: 15px; color: var(--ok); }
.strip button.on .ck { color: var(--bg); }
@media (max-width: 760px) { .strip { margin: 0 -16px; padding: 2px 16px 4px; } }
.lhead { display: flex; flex-direction: column; gap: 14px; }

.timeline { padding: 20px 20px 16px; border-radius: var(--r-lg); background: var(--paper-2); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; position: relative; }
.timeline .tl-head { display: flex; justify-content: space-between; font-size: .74rem; font-weight: 650; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.tl-row { display: grid; grid-template-columns: 96px 1fr; align-items: center; gap: 12px; font-size: .86rem; font-weight: 600; color: var(--ink-2); }
.tl-track { position: relative; height: 16px; border-radius: 8px; background: repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 10%); }
.tl-track::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1.5px; background: var(--line-2); }
.tl-seg { position: absolute; top: 1px; bottom: 1px; border-radius: 8px; transform-origin: left; }
.tl-seg.n { background: var(--v); }
.tl-seg.m { background: var(--h); }

.tl-seg.n.arr { color: var(--v); } .tl-seg.m.arr { color: var(--h); }
.timeline .cap { font-size: .93rem; color: var(--ink-2); padding-top: 4px; border-top: 1px dashed var(--line-2); padding-top: 12px; }
@media (max-width: 760px) { .tl-row { grid-template-columns: 78px 1fr; font-size: .8rem; } }

.rule { position: relative; padding: 22px 22px 20px 24px; border-radius: var(--r-lg); background: var(--paper); border: 1px solid var(--line); box-shadow: var(--shadow-1); display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
.rule::before { content: ""; position: absolute; left: 0; top: 18px; bottom: 18px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
.rule .tag { font: 650 .7rem/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); display: flex; align-items: center; gap: 8px; }
.rule .de { font: italic 420 1.16rem/1.5 var(--serif); letter-spacing: -.005em; font-variation-settings: "opsz" 24, "SOFT" 30; color: var(--ink); }
.rule .tr { color: var(--ink-2); font-size: .98rem; }
.rule .note { font-size: .86rem; color: var(--ink-3); border-top: 1px dashed var(--line-2); padding-top: 10px; }

.ex { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-radius: var(--r-lg); background: var(--paper); border: 1px solid var(--line); box-shadow: var(--shadow-1); overflow: hidden; }
.ex li { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 16px 18px; border-top: 1px solid var(--line); transition: background-color .25s; }
.ex li:first-child { border-top: 0; }
.ex li:hover { background: var(--paper-2); }
.ex .s { font: 420 1.14rem/1.5 var(--serif); letter-spacing: -.003em; font-variation-settings: "opsz" 20; }
.ex .t { grid-column: 1; font-size: .92rem; color: var(--ink-2); }
.ex .t .arrow { color: var(--ink-3); }
.say { grid-row: 1 / span 2; grid-column: 2; align-self: center; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper-2); color: var(--ink-2); cursor: pointer; display: grid; place-items: center; transition: background-color .2s, color .2s, transform .3s var(--spring); }
.say:hover { color: var(--accent); background: var(--accent-soft); }
.say:active { transform: scale(.9); }
.say.on { color: var(--on-accent); background: var(--accent); border-color: var(--accent); }

.note-box { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: start; padding: 18px 20px; border-radius: var(--r-lg); border: 1px solid; }
.note-box .ic { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; }
.note-box .tag { display: block; font: 650 .7rem/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; margin-bottom: 7px; }
.tip { background: color-mix(in srgb, var(--gold-bg) 70%, var(--paper)); border-color: color-mix(in srgb, var(--gold) 30%, transparent); }
.tip .ic { background: var(--gold); color: var(--paper); } .tip .tag { color: color-mix(in srgb, var(--gold) 80%, var(--ink)); }
.trap { background: color-mix(in srgb, var(--no-bg) 70%, var(--paper)); border-color: color-mix(in srgb, var(--no) 25%, transparent); }
.trap .ic { background: var(--no); color: var(--paper); } .trap .tag { color: var(--no); }
.warn { background: var(--paper-2); border-color: var(--line-2); }
.warn .ic { background: var(--ink-2); color: var(--paper); }

.tw { overflow-x: auto; border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--paper); box-shadow: var(--shadow-1); }
table { width: 100%; border-collapse: collapse; font-size: .95rem; }
th { text-align: left; font: 650 .72rem/1.3 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); padding: 14px 16px 10px; border-bottom: 1px solid var(--line-2); background: var(--paper-2); }
td { padding: 12px 16px; border-top: 1px solid var(--line); vertical-align: top; }
tbody tr:first-child td { border-top: 0; }
td:first-child { font-weight: 550; }
td[lang="de"], .tw td .k, .tw td .v, .tw td .h { font-family: var(--serif); }
tbody tr { transition: background-color .2s; }
tbody tr:hover { background: var(--paper-2); }

.stage { position: relative; border-radius: var(--r-lg); background: var(--paper); border: 1px solid var(--line); box-shadow: var(--shadow-1); overflow: hidden; }
.stage::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 90% at 50% 0%, transparent 40%, color-mix(in srgb, var(--sunk) 55%, transparent)); }
.stage-top { position: relative; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 16px 20px 0; }
.stage-top .eyebrow { color: var(--ink-3); }
.stage-ctl { display: flex; align-items: center; gap: 2px; flex: none; }
.stage-b { width: 34px; height: 34px; border: 0; border-radius: 50%; background: none; color: var(--ink-2); cursor: pointer; display: grid; place-items: center; transition: background-color .2s, color .2s, transform .2s var(--spring); }
.stage-b:hover { background: var(--sunk); color: var(--ink); }
.stage-b:active { transform: scale(.9); }
.stage.paused .stage-b[data-sc="pause"] { background: var(--accent-soft); color: var(--accent); }
.stage-step { display: flex; }
.stage-step button { border: 0; background: none; padding: 12px 3px; cursor: pointer; display: grid; place-items: center; }
.stage-step i { display: block; width: 18px; height: 4px; border-radius: 4px; background: var(--line-2); transition: background-color .4s, width .4s var(--ease); }
.stage-step button:hover i { background: var(--ink-3); }
.stage-step button.on i { background: var(--accent); width: 28px; }
.stage-body { position: relative; height: 196px; }
.stage-track { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.stage-ground { position: absolute; left: 20px; right: 20px; bottom: 26px; height: 1.5px; background: repeating-linear-gradient(90deg, var(--line-2) 0 6px, transparent 6px 12px); }
.tok {
  position: absolute; left: 0; top: 0; white-space: nowrap; height: 46px; padding: 0 14px; display: flex; align-items: center; border-radius: 13px;
  font: 450 1.36rem/1 var(--serif); letter-spacing: -.01em; font-variation-settings: "opsz" 36; color: var(--ink);
  background: var(--paper-2); border: 1px solid var(--line); box-shadow: 0 1px 0 rgba(255,255,255,.5) inset, 0 2px 6px -3px rgba(40, 25, 10, .25);
  transition-property: transform, opacity, background-color, color, border-color, box-shadow; transition-timing-function: var(--ease); transition-duration: .6s, .45s, .45s, .45s, .45s, .45s;
  will-change: transform;
}
.tok.p { background: none; border-color: transparent; box-shadow: none; padding: 0 2px; color: var(--ink-3); }
.tok.k { background: var(--k-bg); color: var(--k); border-color: color-mix(in srgb, var(--k) 30%, transparent); font-style: italic; font-weight: 560; }
.tok.hv { background: var(--h-bg); color: var(--h); border-color: color-mix(in srgb, var(--h) 30%, transparent); font-weight: 560; }
.tok.nv { background: var(--v-bg); color: var(--v); border-color: color-mix(in srgb, var(--v) 35%, transparent); font-weight: 560; }
.tok.lift { box-shadow: 0 10px 22px -10px rgba(40, 25, 10, .5); }
.stage-cap { position: relative; padding: 0 20px 18px; min-height: 52px; display: flex; align-items: center; gap: 10px; font-size: .98rem; color: var(--ink-2); }
.stage-cap span { transition: opacity .35s, transform .45s var(--ease); }
.stage-cap span.out { opacity: 0; transform: translateY(6px); }
.stage-static { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 8px; font: 450 1.2rem/1.5 var(--serif); }
.stage-static .muted { font-family: var(--sans); font-size: .92rem; }
@media (max-width: 760px) { .stage-body { height: 176px; } .stage-top { padding: 14px 16px 0; } .stage-cap { padding: 0 16px 16px; font-size: .93rem; } }

.umut { position: absolute; left: 0; top: 0; width: 76px; height: 86px; transition: transform .9s var(--ease-io); will-change: transform; }
.umut svg { width: 100%; height: 100%; overflow: visible; display: block; }
.umut .face-r { transform-origin: 50px 58px; }
.umut.left .face-r { transform: scaleX(-1); }
.u-fur { fill: var(--fur); } .u-fur2 { fill: var(--fur-2); } .u-cream { fill: var(--cream); } .u-nose { fill: var(--nose); }
.u-eye { fill: var(--nose); } .u-glint { fill: #fff; } .u-cheek { fill: var(--cheek); opacity: .55; }
.u-scarf { fill: var(--scarf); } .u-scarf2 { fill: var(--scarf-2); }
.u-line { fill: none; stroke: var(--nose); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.u-whisk { fill: none; stroke: var(--fur-2); stroke-width: 1.4; stroke-linecap: round; opacity: .6; }
.u-body { transform-origin: 50px 104px; }
.u-eyes { transform-origin: 50px 38px; }
.u-arm-l { transform-origin: 31px 70px; transition: transform .4s var(--spring); }
.u-arm-r { transform-origin: 69px 70px; transition: transform .4s var(--spring); }
.u-leg-l, .u-leg-r { transform-origin: 50% 0; }
.u-shadow { fill: var(--nose); opacity: .14; transform-origin: 50px 112px; }
/* boşta sadece yavaş nefes ve arada göz kırpma, başka sürekli hareket olmasın */
html:not([data-motion="calm"]) .umut .u-body { animation: u-breathe 4.2s ease-in-out infinite; }
html:not([data-motion="calm"]) .umut .u-eyes { animation: u-blink 5.2s infinite; }
@keyframes u-breathe { 50% { transform: scale(1.012, .99); } }
@keyframes u-blink { 0%, 93%, 100% { transform: scaleY(1); } 95.5% { transform: scaleY(.08); } }
.umut.walk .u-body { animation: u-bob .44s ease-in-out infinite !important; }
.umut.walk .u-leg-l { animation: u-step .44s ease-in-out infinite; }
.umut.walk .u-leg-r { animation: u-step .44s ease-in-out infinite reverse; }
@keyframes u-bob { 50% { transform: translateY(-2.5px); } }
@keyframes u-step { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
.umut.lift .u-arm-l { transform: rotate(136deg); }
.umut.lift .u-arm-r { transform: rotate(-136deg); }
.umut.hop { animation: u-hop .6s var(--ease); }
@keyframes u-hop { 40% { translate: 0 -10px; } 70% { translate: 0 0; } 85% { translate: 0 -3px; } }
.umut.wave .u-arm-r { animation: u-wave 1.4s ease-in-out 1; }
@keyframes u-wave { 0%, 100% { transform: none; } 18%, 50%, 82% { transform: rotate(-150deg); } 34%, 66% { transform: rotate(-118deg); } }
.umut .u-zzz { opacity: 0; }
.umut.sleep .u-eyes { animation: none; transform: scaleY(.1); }
.umut.sleep .u-zzz { opacity: 1; }
html:not([data-motion="calm"]) .umut.sleep .u-zzz { animation: u-zzz 3.6s ease-in-out infinite; }
@keyframes u-zzz { 0% { opacity: 0; transform: translate(0, 4px); } 30%, 70% { opacity: 1; } 100% { opacity: 0; transform: translate(6px, -8px); } }

/* kamera arkası görünümünde maskot sayfanın içinde duruyor, yanında not */
.cameo { display: grid; grid-template-columns: 88px 1fr; gap: 16px; align-items: end; }
.cameo .umut { position: relative; width: 88px; height: 100px; }
.cameo .bubble { position: relative; align-self: center; padding: 14px 18px; border-radius: 20px 20px 20px 6px; background: var(--paper); border: 1px solid var(--line); box-shadow: var(--shadow-1); font-size: .98rem; color: var(--ink-2); }
.cameo .bubble b { color: var(--ink); }
.cameo .bubble::before { content: ""; position: absolute; left: -7px; bottom: 12px; width: 12px; height: 12px; background: var(--paper); border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); transform: rotate(45deg); border-radius: 0 0 0 3px; }
.cameo.sm { grid-template-columns: 70px 1fr; }
.cameo.sm .umut { width: 70px; height: 80px; }

.drill { display: flex; flex-direction: column; gap: 14px; padding-top: 10px; }
.drill-h { display: flex; flex-direction: column; gap: 8px; padding-bottom: 4px; }
.drill-h h2 { margin: 0; }
.drill-h .de { font: italic 420 1.06rem/1.45 var(--serif); color: var(--ink-2); }
.drill-h .tr { color: var(--ink-2); font-size: .95rem; }
.muster { padding: 16px 18px; border-radius: var(--r); background: var(--paper-2); border: 1px dashed var(--line-2); font: 420 1.04rem/1.55 var(--serif); }
.muster .tag { display: block; font: 650 .7rem/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }
.muster .to { display: block; color: var(--v); font-style: italic; margin-top: 4px; }

.item { position: relative; display: flex; flex-direction: column; gap: 12px; padding: 20px; border-radius: var(--r-lg); background: var(--paper); border: 1px solid var(--line); box-shadow: var(--shadow-1); transition: border-color .4s, box-shadow .4s; }
.item.ok { border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
.item.no { border-color: color-mix(in srgb, var(--no) 40%, transparent); }
.item .n { display: flex; align-items: center; gap: 8px; font: 650 .72rem/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.item .n .st { margin-left: auto; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; }
.item.ok .n .st { background: var(--ok); color: var(--paper); }
.item .q { font: 430 1.16rem/1.5 var(--serif); letter-spacing: -.003em; font-variation-settings: "opsz" 20; }
.item .q.big { font-size: clamp(1.3rem, 3.2vw, 1.6rem); line-height: 1.35; font-weight: 450; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt {
  min-height: 46px; padding: 9px 18px; border-radius: 14px; border: 1px solid var(--line-2); background: var(--paper-2); cursor: pointer; text-align: left;
  font: 450 1.04rem/1.35 var(--serif); transition: background-color .2s, border-color .2s, color .2s, transform .35s var(--spring), box-shadow .25s;
}
.opt:hover:not(:disabled) { border-color: var(--ink-2); transform: translateY(-1px); box-shadow: var(--shadow-1); }
.opt:active:not(:disabled) { transform: scale(.97); }
.opt:disabled { cursor: default; }
.opt.right { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); font-weight: 560; }
.opt.wrong { background: var(--no-bg); border-color: var(--no); color: var(--no); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.opt.chosen { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.opts.col { flex-direction: column; } .opts.col .opt { width: 100%; }
textarea, input[type="search"], input[type="date"], input[type="time"] {
  width: 100%; font: 430 1.08rem/1.5 var(--serif); color: var(--ink); padding: 13px 15px; border-radius: 14px; border: 1px solid var(--line-2); background: var(--paper-2); resize: vertical;
  transition: border-color .2s, box-shadow .25s, background-color .2s;
}
input[type="search"], input[type="date"], input[type="time"] { font-family: var(--sans); font-size: 1rem; }

.field { display: flex; flex-direction: column; gap: 6px; font-size: .88rem; font-weight: 600; color: var(--ink-2); flex: 1; min-width: 200px; }
.fb { padding: 13px 16px; border-radius: 14px; font-size: .96rem; line-height: 1.55; animation: fb-in .45s var(--ease); }

.fb.ok { background: var(--ok-bg); color: color-mix(in srgb, var(--ok) 75%, var(--ink)); }

.fb .rule-d summary, .drill .how summary { font: 600 .9rem/1.3 var(--sans); padding: 4px 26px 4px 0; display: inline-flex; align-items: center; gap: 6px; color: inherit; }

.flip { position: relative; display: block; width: 100%; height: 300px; perspective: 1400px; border: 0; background: none; padding: 0; cursor: pointer; }
.flip .in { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .8s var(--ease); }

.flip .f { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 26px; text-align: center; background: var(--paper); border: 1px solid var(--line); box-shadow: var(--shadow-2); }

.flip .f.b { transform: rotateY(180deg); background: var(--paper-2); }
.flip .big { font: 450 clamp(2rem, 6vw, 2.8rem)/1.1 var(--serif); letter-spacing: -.025em; font-variation-settings: "opsz" 96; }

details { border-bottom: 1px solid var(--line); }

.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }

.finish { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; padding: 30px 22px; border-radius: var(--r-lg); background: var(--paper-2); border: 1px solid var(--line); }

.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(30, 20, 10, .18); opacity: 0; transition: opacity .3s; }

.sheet {
  position: fixed; z-index: 41; top: 82px; right: max(16px, calc((100vw - var(--wide)) / 2)); width: 360px; max-height: calc(100vh - 100px); overflow: auto;
  padding: 18px; border-radius: 26px; background: var(--paper); border: 1px solid var(--line); box-shadow: var(--shadow-2);
  transform-origin: top right; opacity: 0; transform: translateY(-6px) scale(.97); transition: opacity .25s, transform .4s var(--ease);

.sheet-h b { font: 500 1.35rem/1 var(--serif); }
.sec { padding: 14px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.sec h4 { margin: 0; font: 650 .7rem/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }

.th { border: 1.5px solid var(--line); background: none; border-radius: 16px; padding: 8px 6px 9px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: .8rem; font-weight: 600; color: var(--ink-2); transition: border-color .2s; }

.th.on { border-color: var(--accent); color: var(--ink); }
.seg { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 3px; border-radius: 12px; background: var(--sunk); }

.seg button.on { color: var(--ink); background: var(--paper); box-shadow: 0 1px 2px rgba(40,25,10,.12); }
.lab { display: flex; justify-content: space-between; font-size: .9rem; font-weight: 600; color: var(--ink-2); }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.sw-row { display: flex; align-items: center; justify-content: space-between; width: 100%; border: 0; background: none; padding: 6px 0; cursor: pointer; font-size: .95rem; font-weight: 550; color: var(--ink); }
.sw-row i { position: relative; width: 44px; height: 26px; border-radius: 999px; background: var(--line-2); transition: background-color .25s; flex: none; }
.sw-row i::after { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .35s var(--spring); }

@media (max-width: 760px) {
  .sheet { top: auto; bottom: 0; left: 0; right: 0; width: auto; max-height: 82vh; border-radius: 28px 28px 0 0; padding: 12px 18px calc(22px + env(safe-area-inset-bottom)); transform: translateY(100%); transform-origin: bottom; }

  .sheet.in { transform: none; }
}

.credit { max-width: var(--read); margin: 64px auto 0; padding-top: 18px; border-top: 1px solid var(--line); text-align: center; font-size: .86rem; color: var(--ink-3); }
.credit span { color: var(--ink-2); font-weight: 600; }

.toast { position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom)); z-index: 50; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 12px 20px; border-radius: 999px; font-weight: 600; box-shadow: var(--shadow-2); white-space: nowrap; animation: toast 2.6s var(--ease) forwards; }
@media (max-width: 760px) { .toast { bottom: calc(92px + env(safe-area-inset-bottom)); } }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 12px) scale(.96); } 12%, 85% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, 6px); } }
#fx { position: fixed; inset: 0; z-index: 60; pointer-events: none; }

/* sayfaya girince üsttekiler sırayla yükselir, kaydırınca gelenler bulanıktan netleşir. eğme zıplama yok */
.rv:not(.in) { opacity: 0; transform: translateY(22px); filter: blur(5px); }
.rv.in:not(.done) { transition: opacity .8s var(--ease) var(--d, 0ms), transform 1s var(--ease) var(--d, 0ms), filter .8s var(--ease) var(--d, 0ms); }
